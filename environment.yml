# Pinned environment for edge-audit (added 2026-10-26).
#
#   conda env create -f environment.yml
#   conda run -n edge-audit python -m pytest -q -p no:cacheprovider tests
#
# Python 3.12 with the package versions that were installed in the default
# /opt/anaconda3 environment (Python 3.14) on 2026-10-26. On that 3.14 build,
# pandas segfaults whenever it builds a datetime (pd.to_datetime, bdate_range,
# DataFrame.stack, or reading a parquet file with a timestamp column).
name: edge-audit
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - sqlite
  - pip:
      - numpy==2.4.6
      - pandas==2.2.3
      - pyarrow==23.0.1
      - scipy==1.18.0
      - scikit-learn==1.9.0
      - statsmodels==0.14.6
      - matplotlib==3.11.0
      - seaborn==0.13.2
      - joblib==1.5.3
      - openpyxl==3.1.5
      - requests==2.34.2
      - SQLAlchemy==2.0.51
      - tqdm==4.68.2
      - yfinance==1.7.0
      - wrds==3.5.0
      - torch==2.14.1
      - pytest==9.0.3
      - bidask==2.1.0
